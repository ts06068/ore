[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ore-scholarly"
version = "0.2.0rc2"
description = "Scholarly source adapters and versioned journal Rune packs for ORE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "defusedxml>=0.7.1,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ore_scholarly = ["runes/*.json"]
