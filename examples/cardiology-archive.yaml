name: JACC original research archive
goal: Build the official JACC main-journal volume and issue inventory for the specified period. Classify original primary research using publisher labels and study design. Retrieve each included published main PDF and every supplementary object in its original format. Reconcile official TOC counts, record all access gaps, and preserve exact provenance. Reviews, editorials and other JACC journals are excluded.
rune_id: journal.jacc
publication_window:
  basis: issue_date
  from: '2006-01-01'
  until_exclusive: '2026-01-01'
sources: [pubmed, crossref]
journals: [Journal of the American College of Cardiology]
completeness: inventory
artifact_roles: [main_pdf, supplement]
access_profile_ref: institution
scope:
  article_versions: [published]
routing: {mode: auto}
budget:
  max_turns: 100
  max_seconds: 3600
  max_agent_workers: 10
  max_bytes: 1000000000
parallelism:
  initial: 5
  mode: adaptive
  per_origin: 1
retrieval_policy:
  mode: api_open_access_first
  browser_fallback: true
on_challenge:
  policy_version: 2
  mode: auto
  adaptive: true
  max_attempts_per_episode: 3
  max_elapsed_seconds: 120
  hard_max_attempts: 6
  hard_max_elapsed_seconds: 300
